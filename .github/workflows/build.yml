name: Build and Archive Glimpsify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Code-Signing Certificates
        if: github.event_name != 'pull_request'
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Download Provisioning Profiles
        if: github.event_name != 'pull_request'
        uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: com.rudrankriyam.Glimpsify
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Create ExportOptions.plist (Signed)
        if: github.event_name != 'pull_request'
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

      - name: Create ExportOptions.plist (Unsigned - for PRs)
        if: github.event_name == 'pull_request'
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>mac-application</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>none</string>
          </dict>
          </plist>
          EOF

      - name: Build app (Signed)
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild build \
            -project Glimpsify.xcodeproj \
            -scheme Glimpsify \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}"

      - name: Build app (Unsigned - for PRs)
        if: github.event_name == 'pull_request'
        run: |
          xcodebuild build \
            -project Glimpsify.xcodeproj \
            -scheme Glimpsify \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Find and copy app bundle
        run: |
          find ./build -name "Glimpsify.app" -type d | head -1 | xargs -I {} cp -R {} ./Glimpsify.app
          ls -la ./Glimpsify.app

      - name: Notarize app
        if: github.event_name != 'pull_request'
        run: |
          # Create a zip file for notarization
          ditto -c -k --keepParent ./Glimpsify.app Glimpsify.zip

          # Submit for notarization
          xcrun notarytool submit Glimpsify.zip \
            --apple-id "${{ secrets.NOTARIZATION_APPLE_ID }}" \
            --password "${{ secrets.NOTARIZATION_PASSWORD }}" \
            --team-id "${{ secrets.TEAM_ID }}" \
            --wait

          # Staple the notarization
          xcrun stapler staple ./Glimpsify.app

      - name: Create DMG
        run: |
          mkdir -p dmg-temp
          cp -R ./Glimpsify.app dmg-temp/
          hdiutil create -volname "Glimpsify" -srcfolder dmg-temp -ov -format UDZO Glimpsify.dmg

      - name: Notarize DMG
        if: github.event_name != 'pull_request'
        run: |
          # Submit DMG for notarization
          xcrun notarytool submit Glimpsify.dmg \
            --apple-id "${{ secrets.NOTARIZATION_APPLE_ID }}" \
            --password "${{ secrets.NOTARIZATION_PASSWORD }}" \
            --team-id "${{ secrets.TEAM_ID }}" \
            --wait

          # Staple the notarization
          xcrun stapler staple Glimpsify.dmg

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Glimpsify-${{ github.sha }}
          path: Glimpsify.app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Glimpsify-DMG-${{ github.sha }}
          path: Glimpsify.dmg

  release:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Glimpsify-DMG-${{ github.sha }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Glimpsify.dmg
          body: |
            ## Glimpsify Release

            Download and install Glimpsify for macOS.

            ### Installation
            1. Download the DMG file
            2. Open the DMG
            3. Drag Glimpsify.app to your Applications folder
            4. Launch from Applications or Spotlight

            ### Requirements
            - macOS 14.0+
            - Groq API key (free at console.groq.com)

            ### Security
            This release is code-signed and notarized by Apple for your security.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
