name: Build and Archive Glimpsify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>mac-application</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>none</string>
          </dict>
          </plist>
          EOF

      - name: Build app
        run: |
          xcodebuild build \
            -project Glimpsify.xcodeproj \
            -scheme Glimpsify \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Find and copy app bundle
        run: |
          find ./build -name "Glimpsify.app" -type d | head -1 | xargs -I {} cp -R {} ./Glimpsify.app
          ls -la ./Glimpsify.app

      - name: Create DMG
        run: |
          mkdir -p dmg-temp
          cp -R ./Glimpsify.app dmg-temp/
          hdiutil create -volname "Glimpsify" -srcfolder dmg-temp -ov -format UDZO Glimpsify.dmg

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Glimpsify-${{ github.sha }}
          path: Glimpsify.app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Glimpsify-DMG-${{ github.sha }}
          path: Glimpsify.dmg

  release:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Glimpsify-DMG-${{ github.sha }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Glimpsify.dmg
          body: |
            ## Glimpsify Release

            Download and install Glimpsify for macOS.

            ### Installation
            1. Download the DMG file
            2. Open the DMG
            3. Drag Glimpsify.app to your Applications folder
            4. Launch from Applications or Spotlight

            ### Requirements
            - macOS 14.0+
            - Groq API key (free at console.groq.com)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
