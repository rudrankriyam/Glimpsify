name: Build and Archive Glimpsify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-latest
    environment: Apple

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Code-Signing Certificates
        if: github.event_name != 'pull_request'
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Create ExportOptions.plist (Signed)
        if: github.event_name != 'pull_request'
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

      - name: Create ExportOptions.plist (Unsigned - for PRs)
        if: github.event_name == 'pull_request'
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>mac-application</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>none</string>
          </dict>
          </plist>
          EOF

      - name: Build app (Signed)
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild build \
            -project Glimpsify.xcodeproj \
            -scheme Glimpsify \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Build app (Unsigned - for PRs)
        if: github.event_name == 'pull_request'
        run: |
          xcodebuild build \
            -project Glimpsify.xcodeproj \
            -scheme Glimpsify \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Find and copy app bundle
        run: |
          find ./build -name "Glimpsify.app" -type d | head -1 | xargs -I {} cp -R {} ./Glimpsify.app
          ls -la ./Glimpsify.app

      - name: Notarize app
        if: github.event_name != 'pull_request'
        run: |
          set -e # Ensure script exits immediately if a command exits with a non-zero status.

          # Create a zip file for notarization
          echo "Creating zip for notarization..."
          ditto -c -k --keepParent ./Glimpsify.app Glimpsify.zip
          echo "Zip created."

          # Submit for notarization and capture output
          echo "Submitting for notarization..."
          SUBMISSION_OUTPUT_FILE="submission_output.txt"
          # Run submit command, allow it to 'fail' if status is Invalid, and save all output
          xcrun notarytool submit Glimpsify.zip \
            --apple-id "${{ secrets.NOTARIZATION_APPLE_ID }}" \
            --password "${{ secrets.NOTARIZATION_PASSWORD }}" \
            --team-id "${{ secrets.TEAM_ID }}" \
            --wait > "$SUBMISSION_OUTPUT_FILE" 2>&1 || true

          echo "--- Full submission command output from notarytool ---"
          cat "$SUBMISSION_OUTPUT_FILE"
          echo "--- End of submission command output ---"

          # Extract Submission ID (first one found) and Status (last one found)
          SUBMISSION_ID=$(grep -oE 'id: [0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}' "$SUBMISSION_OUTPUT_FILE" | awk '{print $2}' | head -n 1)
          STATUS=$(grep -oE 'status: [a-zA-Z]+' "$SUBMISSION_OUTPUT_FILE" | awk '{print $2}' | tail -n 1)

          echo "Extracted Submission ID: ${SUBMISSION_ID}"
          echo "Extracted Status: ${STATUS}"

          if [ -n "$SUBMISSION_ID" ]; then
            echo "Fetching notarization log for ID: $SUBMISSION_ID..."
            # Fetch the log
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "${{ secrets.NOTARIZATION_APPLE_ID }}" \
              --password "${{ secrets.NOTARIZATION_PASSWORD }}" \
              --team-id "${{ secrets.TEAM_ID }}"
          else
            echo "Could not extract Submission ID from the notarytool output. Cannot fetch detailed log."
          fi

          # Check status and fail explicitly if not successful
          # Apple's notary service might return "Accepted" or "Success" for a positive outcome.
          if [ "$STATUS" != "Accepted" ] && [ "$STATUS" != "Success" ]; then
            echo "Notarization failed with status: $STATUS. Please check the log above for details."
            exit 1
          fi

          echo "Notarization successful (Status: $STATUS). Proceeding to staple..."
          # Staple the notarization
          xcrun stapler staple ./Glimpsify.app
          echo "Stapling complete."

      - name: Create DMG
        run: |
          mkdir -p dmg-temp
          cp -R ./Glimpsify.app dmg-temp/
          hdiutil create -volname "Glimpsify" -srcfolder dmg-temp -ov -format UDZO Glimpsify.dmg

      - name: Notarize DMG
        if: github.event_name != 'pull_request'
        run: |
          # Submit DMG for notarization
          xcrun notarytool submit Glimpsify.dmg \
            --apple-id "${{ secrets.NOTARIZATION_APPLE_ID }}" \
            --password "${{ secrets.NOTARIZATION_PASSWORD }}" \
            --team-id "${{ secrets.TEAM_ID }}" \
            --wait

          # Staple the notarization
          xcrun stapler staple Glimpsify.dmg

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Glimpsify-${{ github.sha }}
          path: Glimpsify.app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Glimpsify-DMG-${{ github.sha }}
          path: Glimpsify.dmg

  release:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Glimpsify-DMG-${{ github.sha }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Glimpsify.dmg
          body: |
            ## Glimpsify Release

            Download and install Glimpsify for macOS.

            ### Installation
            1. Download the DMG file
            2. Open the DMG
            3. Drag Glimpsify.app to your Applications folder
            4. Launch from Applications or Spotlight

            ### Requirements
            - macOS 14.0+
            - Groq API key (free at console.groq.com)

            ### Security
            This release is code-signed and notarized by Apple for your security.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
